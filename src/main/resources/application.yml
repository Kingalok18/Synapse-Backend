spring:
  application:
    name: synapse-backend
  profiles:
    active: dev

server:
  port: 8080
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  show-actuator: false

app:
  security:
    jwt:
      secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration-ms: 86400000
      refresh-expiration-ms: 604800000
    oauth2:
      authorized-redirect-uris: http://localhost:5173/oauth2/redirect