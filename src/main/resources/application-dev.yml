spring:
  datasource:
    url: jdbc:mysql://localhost:3306/synapse?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:synapse}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}


  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:mock-google-client-id-for-dev-only.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET:mock-google-client-secret-for-dev}
            scope:
              - email
              - profile

logging:
  level:
    root: INFO
    com.synapse.backend: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO