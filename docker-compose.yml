version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: synapse-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: synapse
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - synapse-network

  mongodb:
    image: mongo:7.0
    container_name: synapse-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - synapse-network

  redis:
    image: redis:7.2-alpine
    container_name: synapse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - synapse-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: synapse-backend
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=synapse
      - DB_USER=root
      - DB_PASSWORD=root
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DB=synapse
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-placeholder-id}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-placeholder-secret}
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    networks:
      - synapse-network

networks:
  synapse-network:
    driver: bridge

volumes:
  mysql_data:
  mongodb_data:
  redis_data: